<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Customer - Food Ordering System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">

    <header class="header">
        <h1>Food Ordering System</h1>
        <p class="subtitle">Customer Registration</p>
        <nav class="nav">
            <a href="index.html" class="nav-link active">Register Customer</a>
            <a href="customers.html" class="nav-link">View Customers</a>
            <a href="menu.html" class="nav-link">Menu</a>
            <a href="order.html" class="nav-link">Place Order</a>
            <a href="orders.html" class="nav-link">Orders</a>
        </nav>
    </header>

    <main class="card">

        <h2>Register a new customer</h2>
        <p class="hint">Fill in the form and press <strong>Register</strong>.
            The customer ID is generated automatically by MySQL.</p>

        <!-- Message area: success and error messages appear here -->
        <div id="message" class="message hidden"></div>

        <!-- The form. "novalidate" lets OUR JavaScript show the messages,
             so the text matches the messages the server sends back. -->
        <form id="registerForm" novalidate>

            <div class="form-group">
                <label for="name">Full name <span class="required">*</span></label>
                <input type="text" id="name" name="name" placeholder="e.g. Tamanna " autocomplete="name">
                <p class="field-error" id="nameError"></p>
            </div>

            <div class="form-group">
                <label for="email">Email address <span class="required">*</span></label>
                <input type="email" id="email" name="email" placeholder="e.g. tamanna@example.com" autocomplete="email">
                <p class="field-error" id="emailError"></p>
            </div>

            <div class="form-group">
                <label for="phone">Phone number <span class="required">*</span></label>
                <input type="tel" id="phone" name="phone" placeholder="10 digits, e.g. 9876543210"
                       inputmode="numeric" maxlength="10">
                <p class="field-error" id="phoneError"></p>
            </div>

            <button type="submit" id="submitButton">Register</button>
        </form>

    </main>

    <footer class="footer">
        <p>Phase 1 &mdash; Spring Boot + MySQL (RDBMS mini project)</p>
    </footer>

</div>

<script src="js/register.js"></script>
</body>
</html>
