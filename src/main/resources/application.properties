# ============================================================
#  Food Ordering System - Spring Boot configuration
# ============================================================
spring.application.name=food-ordering

# ------------------------------------------------------------
#  DATABASE CONNECTION
# ------------------------------------------------------------
#  The values below come from environment variables, so your MySQL
#  password is NEVER stored in this project.
#
#  Set them once in your terminal before starting the app:
#
#      export DB_USERNAME=root
#      export DB_PASSWORD=your_real_password
#      export DB_URL="jdbc:mysql://localhost:3306/food_ordering?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
#
#  If you do not set DB_URL the default below is used
#  (local MySQL, database "food_ordering", port 3306).
# ------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/food_ordering?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Dialect (auto-detect usually works, but explicit is safer)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------
#  JPA / HIBERNATE
# ------------------------------------------------------------
#  "update" makes Hibernate create the "customer" table for you
#  if it does not exist yet, and keep it in sync with the entity class.
#  Use "validate" if you want Hibernate to only check the table.
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update

#  These two lines print every SQL statement that is sent to MySQL.
#  Very useful for showing your teacher exactly which INSERT ran.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# ------------------------------------------------------------
#  WEB SERVER
# ------------------------------------------------------------
server.port=8080

# ------------------------------------------------------------
#  SAMPLE MENU DATA
# ------------------------------------------------------------
#  When the app starts it adds a few sample dishes to the menu.
#  A dish is only inserted when there is no dish with that name
#  yet, so restarting the app never creates duplicates.
#
#  Set this to false to start with an empty menu.
# ------------------------------------------------------------
app.menu.seed=${MENU_SEED:true}

# ------------------------------------------------------------
#  FRIENDLY STARTUP ERROR
# ------------------------------------------------------------
#  If the database is unreachable, print a short hint instead of a long stack trace.
spring.datasource.hikari.initialization-fail-timeout=1
