# ============================================================
#  Configuration used ONLY by the automated tests (src/test/...).
#  The tests use an in-memory H2 database in MySQL compatibility
#  mode, so they can run without a MySQL server.
#  The real application uses MySQL (see ../main/resources/application.properties).
# ============================================================
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# The tests want an empty menu table, so the sample data is not added.
app.menu.seed=false
